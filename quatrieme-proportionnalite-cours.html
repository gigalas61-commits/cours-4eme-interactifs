<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proportionnalité — Cours 4ème</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f2ed;--surface:#ffffff;--surface2:#ebe6de;--text:#2c2418;--heading:#8b4513;
  --muted:#6b5a48;--border:#d4c8b8;--accent:#a0522d;--accent-light:#faf5ef;
  --radius:10px;--shadow:0 2px 12px rgba(0,0,0,.08);
  --font-heading:'Cormorant Garamond',Georgia,serif;
  --font-body:'Nunito Sans',system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161210;--surface:#221c18;--surface2:#302820;--text:#ddd0c0;--heading:#e0a868;
    --muted:#9a8878;--border:#403428;--accent:#d08840;--accent-light:#1e1610;
    --shadow:0 2px 12px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#161210;--surface:#221c18;--surface2:#302820;--text:#ddd0c0;--heading:#e0a868;
  --muted:#9a8878;--border:#403428;--accent:#d08840;--accent-light:#1e1610;
  --shadow:0 2px 12px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.7;min-height:100vh;}
.wrap{max-width:860px;margin:0 auto;padding:16px;}
header{text-align:center;padding:32px 0 18px;position:relative;}
header h1{font-family:var(--font-heading);font-weight:700;font-size:clamp(1.8rem,5vw,2.6rem);color:var(--heading);margin-bottom:4px;}
header p.sub{color:var(--muted);font-size:.95rem;}
.badge{display:inline-block;background:var(--accent);color:#fff;font-family:var(--font-heading);font-weight:700;font-size:.85rem;padding:3px 14px;border-radius:20px;margin-bottom:10px;}
.theme-toggle{position:absolute;top:16px;right:0;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:.82rem;color:var(--muted);font-family:var(--font-body);}
.theme-toggle:hover{background:var(--accent-light);}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:18px 0 24px;position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0;}
nav.tabs button{font-family:var(--font-body);font-weight:600;font-size:.82rem;padding:7px 14px;border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--muted);cursor:pointer;transition:all .2s;}
nav.tabs button:hover{border-color:var(--accent);color:var(--accent);}
nav.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
section.tab{display:none;}
section.tab.active{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow);}
h2{font-family:var(--font-heading);font-weight:700;font-size:1.55rem;color:var(--heading);margin-bottom:14px;border-bottom:2px solid var(--border);padding-bottom:8px;}
h3{font-family:var(--font-heading);font-weight:600;font-size:1.2rem;color:var(--heading);margin:18px 0 8px;}
.def{background:var(--accent-light);border-left:4px solid var(--accent);padding:14px 18px;border-radius:0 var(--radius) var(--radius) 0;margin:14px 0;font-size:.95rem;}
.def strong{color:var(--accent);}
.example{background:var(--surface2);padding:14px 18px;border-radius:var(--radius);margin:12px 0;font-size:.93rem;}
table.prop{width:100%;border-collapse:collapse;margin:12px 0;font-size:.93rem;}
table.prop th,table.prop td{border:1px solid var(--border);padding:8px 12px;text-align:center;}
table.prop th{background:var(--accent);color:#fff;font-weight:600;}
table.prop td{background:var(--surface);}
canvas{display:block;margin:16px auto;border-radius:var(--radius);max-width:100%;}
.exercise{background:var(--surface2);padding:16px 18px;border-radius:var(--radius);margin:14px 0;}
.exercise p{margin-bottom:8px;}
.exercise label{font-weight:600;color:var(--heading);font-size:.92rem;}
input[type="number"],input[type="text"]{font-family:var(--font-body);font-size:.95rem;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);width:90px;text-align:center;}
input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
button.btn{font-family:var(--font-body);font-weight:600;font-size:.88rem;padding:8px 18px;border:none;border-radius:6px;cursor:pointer;background:var(--accent);color:#fff;margin:6px 4px 6px 0;transition:opacity .2s;}
button.btn:hover{opacity:.85;}
button.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.feedback{margin-top:8px;padding:8px 12px;border-radius:6px;font-size:.9rem;font-weight:600;}
.feedback.correct{background:#d4edda;color:#155724;}
.feedback.wrong{background:#f8d7da;color:#721c24;}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .feedback.correct{background:#1a3a1a;color:#8fdf8f;}
  :root:not([data-theme="light"]) .feedback.wrong{background:#3a1a1a;color:#df8f8f;}
}
:root[data-theme="dark"] .feedback.correct{background:#1a3a1a;color:#8fdf8f;}
:root[data-theme="dark"] .feedback.wrong{background:#3a1a1a;color:#df8f8f;}
details{margin:12px 0;}
details summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:.93rem;padding:6px 0;}
details summary:hover{text-decoration:underline;}
details .correction{padding:10px 14px;background:var(--accent-light);border-radius:0 0 var(--radius) var(--radius);font-size:.92rem;line-height:1.7;}
.qcm-q{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:12px 0;}
.qcm-q p{font-weight:600;margin-bottom:8px;}
.qcm-q label{display:block;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:.92rem;margin:2px 0;transition:background .15s;}
.qcm-q label:hover{background:var(--surface2);}
.qcm-q input[type="radio"]{margin-right:8px;accent-color:var(--accent);}
.score-box{text-align:center;padding:24px;background:var(--accent-light);border:2px solid var(--accent);border-radius:var(--radius);margin:20px 0;}
.score-box .big{font-family:var(--font-heading);font-size:2.4rem;font-weight:700;color:var(--accent);}
.difficulty{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:12px;margin-bottom:8px;text-transform:uppercase;}
.difficulty.appliquer{background:#d4edda;color:#155724;}
.difficulty.comprendre{background:#fff3cd;color:#856404;}
.difficulty.approfondir{background:#f8d7da;color:#721c24;}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .difficulty.appliquer{background:#1a3a1a;color:#8fdf8f;}
  :root:not([data-theme="light"]) .difficulty.comprendre{background:#3a2e10;color:#dfbf5f;}
  :root:not([data-theme="light"]) .difficulty.approfondir{background:#3a1a1a;color:#df8f8f;}
}
:root[data-theme="dark"] .difficulty.appliquer{background:#1a3a1a;color:#8fdf8f;}
:root[data-theme="dark"] .difficulty.comprendre{background:#3a2e10;color:#dfbf5f;}
:root[data-theme="dark"] .difficulty.approfondir{background:#3a1a1a;color:#df8f8f;}
.slider-wrap{display:flex;align-items:center;gap:12px;margin:12px 0;}
.slider-wrap input[type="range"]{flex:1;accent-color:var(--accent);}
.slider-wrap span{font-weight:600;min-width:60px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){
  .wrap{padding:12px 16px;}
  nav.tabs button{font-size:.75rem;padding:6px 10px;}
  .card{padding:16px;}
  .grid2{grid-template-columns:1fr;}
  h2{font-size:1.3rem;}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="badge">4ème</span>
  <h1>Proportionnalité</h1>
  <p class="sub">Cours interactif — Collège</p>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Changer de thème">☀ / ☾</button>
</header>
<nav class="tabs" id="tabNav"></nav>
<div id="tabContent"></div>
</div>

<script>
var tabNames=["Reconnaître","Produit en croix","Pourcentages","Échelles","Vitesse","Exercices","QCM"];
var loaded=[];
var currentTab=0;

function getCSSVar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

function toggleTheme(){
  var r=document.documentElement;
  var cur=r.getAttribute("data-theme");
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");
}

function buildNav(){
  var nav=document.getElementById("tabNav");
  var cont=document.getElementById("tabContent");
  tabNames.forEach(function(name,i){
    var btn=document.createElement("button");
    btn.textContent=name;
    btn.onclick=function(){showTab(i);};
    if(i===0) btn.className="active";
    nav.appendChild(btn);
    var sec=document.createElement("section");
    sec.className="tab"+(i===0?" active":"");
    sec.id="tab"+i;
    cont.appendChild(sec);
  });
}

function showTab(i){
  var btns=document.querySelectorAll("nav.tabs button");
  var secs=document.querySelectorAll("section.tab");
  btns.forEach(function(b,j){b.classList.toggle("active",j===i);});
  secs.forEach(function(s,j){s.classList.toggle("active",j===i);});
  currentTab=i;
  if(!loaded[i]){initSection(i);loaded[i]=true;}
}

function initSection(i){
  var el=document.getElementById("tab"+i);
  switch(i){
    case 0:initReconnaitre(el);break;
    case 1:initProduitCroix(el);break;
    case 2:initPourcentages(el);break;
    case 3:initEchelles(el);break;
    case 4:initVitesse(el);break;
    case 5:initExercices(el);break;
    case 6:initQCM(el);break;
  }
}

/* ==================== TAB 0 : Reconnaître ==================== */
function initReconnaitre(el){
  el.innerHTML=`
  <div class="card">
    <h2>Reconnaître une situation de proportionnalité</h2>
    <div class="def">
      <strong>Définition :</strong> Deux grandeurs sont <em>proportionnelles</em> lorsque les valeurs de l'une s'obtiennent en multipliant les valeurs de l'autre par un même nombre, appelé <strong>coefficient de proportionnalité</strong>.
    </div>
    <h3>Exemple : tableau de proportionnalité</h3>
    <p>Le prix de pommes au kg :</p>
    <table class="prop">
      <tr><th>Masse (kg)</th><td>1</td><td>2</td><td>3</td><td>5</td></tr>
      <tr><th>Prix (€)</th><td>2,50</td><td>5,00</td><td>7,50</td><td>12,50</td></tr>
    </table>
    <p>Coefficient de proportionnalité : <strong>k = 2,50</strong> (on multiplie la masse par 2,50 pour obtenir le prix).</p>

    <h3>Contre-exemple</h3>
    <table class="prop">
      <tr><th>Âge (ans)</th><td>5</td><td>10</td><td>15</td><td>20</td></tr>
      <tr><th>Taille (cm)</th><td>110</td><td>140</td><td>165</td><td>175</td></tr>
    </table>
    <p>110÷5 = 22, mais 140÷10 = 14. Les quotients ne sont pas égaux : ce <strong>n'est pas</strong> un tableau de proportionnalité.</p>

    <h3>Méthode : vérifier un tableau de proportionnalité</h3>
    <div class="def">
      <strong>Étape 1 :</strong> Calculer les quotients y ÷ x pour chaque colonne.<br>
      <strong>Étape 2 :</strong> Si tous les quotients sont <em>égaux</em>, le tableau est de proportionnalité. Ce quotient commun est le coefficient k.<br>
      <strong>Étape 3 :</strong> Si au moins deux quotients sont <em>différents</em>, ce n'est pas un tableau de proportionnalité.
    </div>

    <h3>Propriété graphique</h3>
    <div class="def">
      <strong>Propriété :</strong> Si deux grandeurs sont proportionnelles, alors les points placés dans un repère sont <strong>alignés avec l'origine</strong> O(0;0). La représentation graphique est une <em>droite passant par l'origine</em>.
    </div>
    <canvas id="canvasReco" width="520" height="340"></canvas>
    <p style="text-align:center;font-size:.85rem;color:var(--muted);">Bleu : proportionnalité (droite par O) — Rouge : non proportionnalité</p>

    <h3>Attention aux pièges !</h3>
    <div class="example">
      <p><strong>Piège 1 :</strong> Un tableau peut avoir des valeurs croissantes sans être proportionnel. Ce qui compte, c'est que le <em>quotient</em> soit constant, pas que les valeurs augmentent.</p>
      <p><strong>Piège 2 :</strong> Une droite qui ne passe pas par l'origine ne correspond <em>pas</em> à une proportionnalité, même si les points sont alignés.</p>
    </div>
  </div>
  <div class="card">
    <h3>Vérifie toi-même</h3>
    <div class="exercise">
      <p>Ce tableau est-il un tableau de proportionnalité ?</p>
      <table class="prop" id="recoTable"></table>
      <div style="margin-top:10px;">
        <button class="btn" onclick="checkRecoExo(true)">Oui</button>
        <button class="btn secondary" onclick="checkRecoExo(false)">Non</button>
        <button class="btn secondary" onclick="newRecoExo()">Nouveau tableau</button>
      </div>
      <div id="recoFeedback"></div>
    </div>
  </div>
  <div class="card">
    <h3>Retenir l'essentiel</h3>
    <div class="def">
      <strong>Pour vérifier la proportionnalité :</strong><br>
      - Dans un <em>tableau</em> : tous les quotients y/x sont égaux → coefficient k<br>
      - Sur un <em>graphique</em> : les points sont alignés avec l'origine O(0;0)<br>
      - Dans un <em>problème</em> : quand une grandeur double, l'autre double aussi
    </div>
  </div>`;
  drawRecoCanvas();
  newRecoExo();
}

function drawRecoCanvas(){
  var c=document.getElementById("canvasReco");
  if(!c) return;
  var ctx=c.getContext("2d");
  var w=c.width,h=c.height;
  var bg=getCSSVar("--surface");
  var border=getCSSVar("--border");
  var text=getCSSVar("--text");
  var accent=getCSSVar("--accent");

  ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
  ctx.strokeStyle=border;ctx.lineWidth=1;
  // axes
  ctx.beginPath();ctx.moveTo(50,h-40);ctx.lineTo(w-20,h-40);ctx.stroke();
  ctx.beginPath();ctx.moveTo(50,h-40);ctx.lineTo(50,20);ctx.stroke();
  ctx.fillStyle=text;ctx.font="13px 'Nunito Sans',sans-serif";
  ctx.fillText("O",35,h-25);ctx.fillText("x",w-30,h-25);ctx.fillText("y",55,30);

  // grid
  ctx.strokeStyle=border;ctx.lineWidth=0.3;
  for(var gx=1;gx<=8;gx++){var px=50+gx*55;ctx.beginPath();ctx.moveTo(px,h-40);ctx.lineTo(px,20);ctx.stroke();ctx.fillStyle=text;ctx.fillText(gx,px-4,h-25);}
  for(var gy=1;gy<=5;gy++){var py=h-40-gy*55;ctx.beginPath();ctx.moveTo(50,py);ctx.lineTo(w-20,py);ctx.stroke();ctx.fillStyle=text;ctx.fillText(gy*2,25,py+4);}

  // proportional line (blue)
  ctx.strokeStyle="#3a7bd5";ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(50,h-40);
  var propPts=[[1,1.5],[2,3],[3,4.5],[5,7.5],[7,10.5]];
  propPts.forEach(function(p){
    var px=50+p[0]*55,py=h-40-p[1]*27.5;
    ctx.lineTo(px,py);
  });
  ctx.stroke();
  propPts.forEach(function(p){
    var px=50+p[0]*55,py=h-40-p[1]*27.5;
    ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fillStyle="#3a7bd5";ctx.fill();
  });

  // non-proportional curve (red)
  ctx.strokeStyle="#d04040";ctx.lineWidth=2.5;
  var nonPts=[[1,2],[2,3.5],[3,4.2],[5,5.8],[7,7]];
  ctx.beginPath();ctx.moveTo(50+nonPts[0][0]*55,h-40-nonPts[0][1]*27.5);
  for(var ni=1;ni<nonPts.length;ni++){
    ctx.lineTo(50+nonPts[ni][0]*55,h-40-nonPts[ni][1]*27.5);
  }
  ctx.stroke();
  nonPts.forEach(function(p){
    var px=50+p[0]*55,py=h-40-p[1]*27.5;
    ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fillStyle="#d04040";ctx.fill();
  });

  // legend
  ctx.fillStyle="#3a7bd5";ctx.fillRect(w-200,30,14,14);
  ctx.fillStyle=text;ctx.font="12px 'Nunito Sans',sans-serif";ctx.fillText("Proportionnelle",w-180,42);
  ctx.fillStyle="#d04040";ctx.fillRect(w-200,52,14,14);
  ctx.fillStyle=text;ctx.fillText("Non proportionnelle",w-180,64);
}

var recoAnswer=true;
function newRecoExo(){
  var isProp=Math.random()>0.5;
  recoAnswer=isProp;
  var k=Math.round((1.5+Math.random()*4)*10)/10;
  var xs=[1,2,3,5];
  var ys;
  if(isProp){
    ys=xs.map(function(x){return Math.round(x*k*10)/10;});
  }else{
    ys=xs.map(function(x){return Math.round((x*k+Math.random()*3-1)*10)/10;});
    // ensure not proportional
    if(ys[0]/xs[0]===ys[1]/xs[1]&&ys[1]/xs[1]===ys[2]/xs[2]) ys[2]+=0.5;
  }
  var tb=document.getElementById("recoTable");
  tb.innerHTML="<tr><th>x</th>"+xs.map(function(x){return "<td>"+x+"</td>";}).join("")+"</tr>"+
    "<tr><th>y</th>"+ys.map(function(y){return "<td>"+y+"</td>";}).join("")+"</tr>";
  document.getElementById("recoFeedback").innerHTML="";
}

function checkRecoExo(ans){
  var fb=document.getElementById("recoFeedback");
  if(ans===recoAnswer){
    fb.innerHTML='<div class="feedback correct">Bravo ! Bonne réponse.</div>';
  }else{
    fb.innerHTML='<div class="feedback wrong">Ce n\'est pas la bonne réponse. Vérifie les quotients y/x.</div>';
  }
}

/* ==================== TAB 1 : Produit en croix ==================== */
function initProduitCroix(el){
  el.innerHTML=`
  <div class="card">
    <h2>Le produit en croix</h2>
    <div class="def">
      <strong>Propriété :</strong> Dans un tableau de proportionnalité, les <em>produits en croix</em> sont égaux.<br>
      Si <strong>a/b = c/d</strong>, alors <strong>a × d = b × c</strong>.
    </div>
    <h3>Méthode : trouver la 4ème proportionnelle</h3>
    <div class="example">
      <p>On sait que 3 kg de pommes coûtent 7,50 €. Combien coûtent 5 kg ?</p>
      <table class="prop">
        <tr><th>Masse (kg)</th><td>3</td><td>5</td></tr>
        <tr><th>Prix (€)</th><td>7,50</td><td>?</td></tr>
      </table>
      <p>Produit en croix : ? = (5 × 7,50) ÷ 3 = 37,50 ÷ 3 = <strong>12,50 €</strong></p>
    </div>
    <canvas id="canvasCroix" width="400" height="220"></canvas>

    <h3>Deuxième exemple</h3>
    <div class="example">
      <p>Une recette pour <strong>6 personnes</strong> demande 400 g de chocolat. Combien pour <strong>9 personnes</strong> ?</p>
      <table class="prop">
        <tr><th>Personnes</th><td>6</td><td>9</td></tr>
        <tr><th>Chocolat (g)</th><td>400</td><td>?</td></tr>
      </table>
      <p>? = (9 × 400) ÷ 6 = 3 600 ÷ 6 = <strong>600 g</strong></p>
    </div>

    <h3>Astuce : le coefficient de proportionnalité</h3>
    <div class="def">
      <strong>Alternative au produit en croix :</strong> on peut aussi trouver d'abord le coefficient k, puis multiplier.<br>
      k = 400 ÷ 6 ≈ 66,67 g/personne<br>
      Pour 9 personnes : 9 × 66,67 ≈ <strong>600 g</strong>
    </div>
  </div>
  <div class="card">
    <h3>Exercice interactif</h3>
    <p>Utilise le produit en croix pour trouver la valeur manquante. De nouveaux exercices sont générés à chaque clic.</p>
    <div class="exercise" id="croixExo"></div>
  </div>`;
  drawCroixCanvas();
  newCroixExo();
}

function drawCroixCanvas(){
  var c=document.getElementById("canvasCroix");
  if(!c) return;
  var ctx=c.getContext("2d");
  var w=c.width,h=c.height;
  ctx.fillStyle=getCSSVar("--surface2");ctx.fillRect(0,0,w,h);
  ctx.font="bold 22px 'Cormorant Garamond',serif";
  ctx.fillStyle=getCSSVar("--heading");
  ctx.textAlign="center";
  ctx.fillText("a",100,60);ctx.fillText("b",300,60);
  ctx.fillText("c",100,160);ctx.fillText("?",300,160);
  // cross lines
  ctx.strokeStyle=getCSSVar("--accent");ctx.lineWidth=2;
  ctx.setLineDash([6,4]);
  ctx.beginPath();ctx.moveTo(120,55);ctx.lineTo(280,155);ctx.stroke();
  ctx.beginPath();ctx.moveTo(280,55);ctx.lineTo(120,155);ctx.stroke();
  ctx.setLineDash([]);
  // formula
  ctx.font="18px 'Nunito Sans',sans-serif";
  ctx.fillStyle=getCSSVar("--text");
  ctx.fillText("? = (b × c) ÷ a",200,200);
}

var croixData={};
function newCroixExo(){
  var a=Math.floor(Math.random()*8)+2;
  var b=Math.floor(Math.random()*8)+2;
  var c=Math.floor(Math.random()*8)+2;
  var d=b*c/a;
  // ensure clean result
  while(d!==Math.round(d*100)/100 || a===b){
    a=Math.floor(Math.random()*6)+2;
    b=Math.floor(Math.random()*9)+2;
    c=a*(Math.floor(Math.random()*4)+2);
    d=b*c/a;
  }
  croixData={a:a,b:b,c:c,answer:d};
  var div=document.getElementById("croixExo");
  div.innerHTML=`
    <p>Trouve la valeur manquante :</p>
    <table class="prop">
      <tr><th></th><td>${a}</td><td>${c}</td></tr>

function calcPct(mode){

    res.innerHTML="Augmentation de "+pct+" % : <strong>"+r.toFixed(2)+" €</strong> (×"+(1+pct/100).toFixed(4)+")";
  }else if(mode==="dim"){

function drawVitesseCanvas(){
  var c=document.getElementById("canvasVitesse");
  if(!c) return;
  var ctx=c.getContext("2d");
  var w=c.width,h=c.height;
  var speed=parseInt(document.getElementById("vitSlider").value);

  ctx.fillStyle=getCSSVar("--surface");ctx.fillRect(0,0,w,h);

  var ox=60,oy=h-45,gw=w-90,gh=h-80;
  // axes
  ctx.strokeStyle=getCSSVar("--text");ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+gw,oy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox,oy-gh);ctx.stroke();

  ctx.fillStyle=getCSSVar("--text");ctx.font="12px 'Nunito Sans',sans-serif";ctx.textAlign="center";
  ctx.fillText("Temps (h)",ox+gw/2,h-8);
  ctx.save();ctx.translate(15,oy-gh/2);ctx.rotate(-Math.PI/2);ctx.fillText("Distance (km)",0,0);ctx.restore();

  // grid and labels
  ctx.strokeStyle=getCSSVar("--border");ctx.lineWidth=0.4;
  var maxT=5,maxD=600;
  for(var ti=1;ti<=maxT;ti++){
    var tx=ox+ti*gw/maxT;
    ctx.beginPath();ctx.moveTo(tx,oy);ctx.lineTo(tx,oy-gh);ctx.stroke();
    ctx.fillStyle=getCSSVar("--text");ctx.fillText(ti+"h",tx,oy+16);
  }
  for(var di=1;di<=6;di++){
    var dy=oy-di*gh/6;
    ctx.beginPath();ctx.moveTo(ox,dy);ctx.lineTo(ox+gw,dy);ctx.stroke();
    ctx.fillStyle=getCSSVar("--text");ctx.textAlign="right";ctx.fillText(di*100,ox-8,dy+4);ctx.textAlign="center";
  }

  // speed line
  ctx.strokeStyle=getCSSVar("--accent");ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(ox,oy);
  var endT=Math.min(maxT,maxD/speed);
  var endX=ox+endT*gw/maxT;
  var endY=oy-speed*endT*gh/maxD;
  ctx.lineTo(endX,endY);ctx.stroke();

  // dot at end
  ctx.beginPath();ctx.arc(endX,endY,5,0,Math.PI*2);ctx.fillStyle=getCSSVar("--accent");ctx.fill();

  // label
  ctx.fillStyle=getCSSVar("--heading");ctx.font="bold 14px 'Nunito Sans',sans-serif";
  ctx.textAlign="left";
  var labelText="v = "+speed+" km/h";
  ctx.fillText(labelText,endX+10,endY+5);

  // reference line at 60 km/h (grey)
  ctx.strokeStyle=getCSSVar("--muted");ctx.lineWidth=1.5;ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.moveTo(ox,oy);
  var ref60endT=Math.min(maxT,maxD/60);
  ctx.lineTo(ox+ref60endT*gw/maxT,oy-60*ref60endT*gh/maxD);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=getCSSVar("--muted");ctx.font="11px 'Nunito Sans',sans-serif";
  ctx.fillText("60 km/h (réf.)",ox+ref60endT*gw/maxT+5,oy-60*ref60endT*gh/maxD+5);
}

  }else if(type===1){

    div.innerHTML=`<p>Un véhicule roule à <strong>${v} km/h</strong> pendant <strong>${t} h</strong>. Quelle distance parcourt-il ?</p>
      <input type="number" id="vitInput" step="any" placeholder="km"> km
      <button class="btn" onclick="checkVit()">Vérifier</button><button class="btn secondary" onclick="newVitExo()">Nouveau</button><div id="vitFb"></div>`;
  }else{
    vitExoData={answer:t};
    div.innerHTML=`<p>Un véhicule parcourt <strong>${d} km</strong> à <strong>${v} km/h</strong>. Combien de temps met-il ?</p>
      <input type="number" id="vitInput" step="any" placeholder="heures"> h
      <button class="btn" onclick="checkVit()">Vérifier</button><button class="btn secondary" onclick="newVitExo()">Nouveau</button><div id="vitFb"></div>`;
  }
}

function checkVit(){
  var val=parseFloat(document.getElementById("vitInput").value);
  var fb=document.getElementById("vitFb");
  if(Math.abs(val-vitExoData.answer)<0.1){
    fb.innerHTML='<div class="feedback correct">Bravo ! La réponse est bien '+vitExoData.answer+'.</div>';
  }else{
    fb.innerHTML='<div class="feedback wrong">Ce n\'est pas la bonne réponse. Rappel : v = d ÷ t, d = v × t, t = d ÷ v.</div>';
  }
}

var vitConvData={};
function newVitConvExo(){
  var toMs=Math.random()>0.5;
  var div=document.getElementById("vitConvExo");
  if(toMs){
    var kmh=[36,54,72,90,108,126,144][Math.floor(Math.random()*7)];
    vitConvData={answer:Math.round(kmh/3.6*100)/100};
    div.innerHTML='<p>Convertis <strong>'+kmh+' km/h</strong> en m/s.</p>'+
      '<input type="number" id="vitConvInput" step="any" placeholder="m/s"> m/s '+
      '<button class="btn" onclick="checkVitConv()">Vérifier</button>'+
      '<button class="btn secondary" onclick="newVitConvExo()">Nouveau</button>'+
      '<div id="vitConvFb"></div>';
  }else{
    var ms=[5,10,15,20,25,30][Math.floor(Math.random()*6)];
    vitConvData={answer:ms*3.6};
    div.innerHTML='<p>Convertis <strong>'+ms+' m/s</strong> en km/h.</p>'+
      '<input type="number" id="vitConvInput" step="any" placeholder="km/h"> km/h '+
      '<button class="btn" onclick="checkVitConv()">Vérifier</button>'+
      '<button class="btn secondary" onclick="newVitConvExo()">Nouveau</button>'+
      '<div id="vitConvFb"></div>';
  }
}

function checkVitConv(){
  var val=parseFloat(document.getElementById("vitConvInput").value);
  var fb=document.getElementById("vitConvFb");
  if(Math.abs(val-vitConvData.answer)<0.1){
    fb.innerHTML='<div class="feedback correct">Bravo ! La réponse est '+vitConvData.answer+'.</div>';
  }else{
    fb.innerHTML='<div class="feedback wrong">Essaie encore. Rappel : km/h ÷ 3,6 = m/s et m/s × 3,6 = km/h.</div>';
  }
}

function initQCM(el){
  var html='<div class="card"><h2>QCM — Teste tes connaissances</h2><p>Réponds aux '+qcmQuestions.length+' questions puis vérifie ton score.</p>';
  qcmQuestions.forEach(function(q,i){
    html+='<div class="qcm-q" id="qcm'+i+'"><p>'+(i+1)+'. '+q.q.replace(/\n/g,"<br>")+'</p>';
    q.choices.forEach(function(ch,j){
      html+='<label><input type="radio" name="qcm'+i+'" value="'+j+'"> '+ch+'</label>';
    });
    html+='</div>';
  });
  html+='<div style="text-align:center;margin-top:20px;">';
  html+='<button class="btn" onclick="scoreQCM()" style="font-size:1rem;padding:12px 30px;">Calculer mon score</button>';
  html+=' <button class="btn secondary" onclick="resetQCM()" style="font-size:1rem;padding:12px 20px;">Recommencer</button>';
  html+='</div>';
  html+='<div id="qcmScore"></div></div>';
  el.innerHTML=html;
}

function scoreQCM(){
  var score=0;
  qcmQuestions.forEach(function(q,i){
    var sel=document.querySelector('input[name="qcm'+i+'"]:checked');
    var div=document.getElementById("qcm"+i);
    div.style.borderColor=sel&&parseInt(sel.value)===q.ans?"#28a745":"#dc3545";
    div.style.borderWidth="2px";
    if(sel&&parseInt(sel.value)===q.ans) score++;
  });
  var pct=Math.round(score/qcmQuestions.length*100);
  var msg,advice;
  if(pct>=90){msg="Excellent travail !";advice="Tu maîtrises très bien la proportionnalité.";}
  else if(pct>=75){msg="Très bon résultat !";advice="Revois les questions ratées pour viser la perfection.";}
  else if(pct>=60){msg="Bon résultat, continue !";advice="Reprends les onglets des thèmes où tu as fait des erreurs.";}
  else if(pct>=40){msg="Résultat moyen.";advice="Relis attentivement le cours, puis refais les exercices de chaque onglet.";}
  else{msg="Il faut revoir le cours.";advice="Reprends chaque onglet dans l'ordre, en faisant les exercices interactifs.";}
  var wrongList="";
  qcmQuestions.forEach(function(q,i){
    var sel=document.querySelector('input[name="qcm'+i+'"]:checked');
    if(!sel||parseInt(sel.value)!==q.ans){
      wrongList+='<li>Q'+(i+1)+' : la bonne réponse était « '+q.choices[q.ans]+' »</li>';
    }
  });
  var corrections=wrongList?'<details style="margin-top:12px;"><summary>Voir les corrections</summary><ul style="text-align:left;padding-left:20px;margin-top:8px;">'+wrongList+'</ul></details>':"";
  document.getElementById("qcmScore").innerHTML='<div class="score-box"><div class="big">'+score+' / '+qcmQuestions.length+'</div><p>'+pct+' % — '+msg+'</p><p style="font-size:.9rem;color:var(--muted);margin-top:6px;">'+advice+'</p>'+corrections+'</div>';
}

function resetQCM(){
  qcmQuestions.forEach(function(q,i){
    var radios=document.querySelectorAll('input[name="qcm'+i+'"]');
    radios.forEach(function(r){r.checked=false;});
    var div=document.getElementById("qcm"+i);
    div.style.borderColor="";div.style.borderWidth="";
  });
  document.getElementById("qcmScore").innerHTML="";
}
