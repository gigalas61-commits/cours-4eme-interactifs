<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractions : opérations</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f2ed;--surface:#ffffff;--surface2:#ebe6de;--text:#2c2418;--heading:#8b4513;
  --muted:#6b5a48;--border:#d4c8b8;--accent:#a0522d;--accent-light:#faf5ef;
  --radius:10px;--shadow:0 2px 8px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161210;--surface:#221c18;--surface2:#302820;--text:#ddd0c0;--heading:#e0a868;
    --muted:#9a8878;--border:#403428;--accent:#d08840;--accent-light:#1e1610;
    --shadow:0 2px 8px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#161210;--surface:#221c18;--surface2:#302820;--text:#ddd0c0;--heading:#e0a868;
  --muted:#9a8878;--border:#403428;--accent:#d08840;--accent-light:#1e1610;
  --shadow:0 2px 8px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Nunito Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  min-height:100vh;
}
h1,h2,h3,h4{
  font-family:'Cormorant Garamond',serif;
  color:var(--heading);
  line-height:1.3;
}
.container{max-width:860px;margin:0 auto;padding:16px}
header{text-align:center;padding:32px 16px 20px;position:relative}
header h1{font-size:2rem;font-weight:700;margin-bottom:4px}
header p{color:var(--muted);font-size:.95rem}
.badge{
  display:inline-block;background:var(--accent);color:#fff;
  font-size:.75rem;font-weight:700;padding:3px 12px;border-radius:20px;
  position:absolute;top:16px;right:16px;letter-spacing:.5px;
}
.theme-toggle{
  position:absolute;top:16px;left:16px;background:var(--surface2);
  border:1px solid var(--border);border-radius:20px;padding:4px 10px;
  cursor:pointer;font-size:1.1rem;line-height:1;
}
nav{
  display:flex;gap:4px;overflow-x:auto;padding:0 16px 12px;
  max-width:860px;margin:0 auto;scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
nav button{
  flex-shrink:0;background:var(--surface2);border:1.5px solid var(--border);
  color:var(--muted);font-family:'Nunito Sans',sans-serif;font-size:.82rem;
  font-weight:600;padding:8px 14px;border-radius:var(--radius);
  cursor:pointer;transition:all .2s;white-space:nowrap;
}
nav button:hover{border-color:var(--accent);color:var(--accent)}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab{
  display:none;background:var(--surface);border-radius:var(--radius);
  padding:28px 24px;margin:0 16px;box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.tab.active{display:block}
.tab h2{font-size:1.55rem;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.tab h3{font-size:1.2rem;margin:22px 0 10px}
.tab h4{font-size:1.05rem;margin:14px 0 8px;color:var(--accent)}
.tab p,.tab li{margin-bottom:8px}
.tab ul,.tab ol{padding-left:22px;margin-bottom:12px}
.rule-box{
  background:var(--accent-light);border-left:4px solid var(--accent);
  padding:14px 18px;border-radius:0 var(--radius) var(--radius) 0;margin:14px 0;
}
.rule-box strong{color:var(--heading)}
.example{
  background:var(--surface2);padding:14px 18px;border-radius:var(--radius);
  margin:12px 0;border:1px solid var(--border);
}
.example .label{
  font-weight:700;color:var(--accent);font-size:.85rem;
  text-transform:uppercase;margin-bottom:6px;
}
.frac{
  display:inline-flex;flex-direction:column;align-items:center;
  vertical-align:middle;margin:0 3px;
}
.frac .num{
  border-bottom:1.5px solid currentColor;padding:0 4px 2px;
  text-align:center;font-weight:600;
}
.frac .den{padding:2px 4px 0;text-align:center;font-weight:600}
.big-frac .num,.big-frac .den{font-size:1.15em;padding:0 6px 2px}
canvas{display:block;margin:14px auto;border-radius:var(--radius);max-width:100%}
details{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius);margin:10px 0;padding:0;
}
details summary{
  cursor:pointer;padding:10px 16px;font-weight:600;color:var(--accent);
  list-style:none;display:flex;align-items:center;gap:8px;
}
details summary::before{
  content:'>';display:inline-block;transition:transform .2s;font-weight:700;
}
details[open] summary::before{transform:rotate(90deg)}
details .content{padding:4px 16px 14px}
.exercise-input{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0;
}
.exercise-input input[type="number"]{
  border:1.5px solid var(--border);border-radius:6px;padding:6px 10px;
  font-size:.95rem;width:60px;text-align:center;background:var(--surface);
  color:var(--text);font-family:'Nunito Sans',sans-serif;
}
.exercise-input input[type="number"]:focus{outline:none;border-color:var(--accent)}
.exercise-input input[type="range"]{accent-color:var(--accent)}
.btn{
  background:var(--accent);color:#fff;border:none;padding:7px 16px;
  border-radius:6px;cursor:pointer;font-family:'Nunito Sans',sans-serif;
  font-weight:600;font-size:.88rem;transition:opacity .2s;
}
.btn:hover{opacity:.85}
.btn-outline{
  background:transparent;color:var(--accent);border:1.5px solid var(--accent);
}
.btn-outline:hover{background:var(--accent-light)}
.feedback{margin:6px 0;font-weight:600;font-size:.9rem;min-height:22px}
.feedback.correct{color:#2e7d32}
.feedback.wrong{color:#c62828}
.qcm-option{
  display:block;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:8px;padding:10px 16px;margin:6px 0;cursor:pointer;
  transition:all .15s;font-size:.95rem;
}
.qcm-option:hover{border-color:var(--accent)}
.qcm-option.selected{border-color:var(--accent);background:var(--accent-light)}
.qcm-option.correct-answer{border-color:#2e7d32;background:rgba(46,125,50,.1)}
.qcm-option.wrong-answer{border-color:#c62828;background:rgba(198,40,40,.08)}
.qcm-question{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 18px;margin:14px 0;
}
.qcm-question h4{margin-top:0}
.score-box{
  text-align:center;padding:20px;background:var(--accent-light);
  border-radius:var(--radius);border:2px solid var(--accent);
  margin-top:16px;font-size:1.1rem;
}
.score-box .score-num{
  font-family:'Cormorant Garamond',serif;font-size:2.4rem;
  font-weight:700;color:var(--accent);
}
.step{
  background:var(--surface2);border-radius:8px;padding:10px 14px;
  margin:6px 0;border-left:3px solid var(--accent);
}
.diff-label{
  display:inline-block;font-size:.7rem;font-weight:700;text-transform:uppercase;
  padding:2px 8px;border-radius:10px;margin-bottom:6px;letter-spacing:.5px;
}
.diff-1{background:#c8e6c9;color:#2e7d32}
.diff-2{background:#fff9c4;color:#f9a825}
.diff-3{background:#ffccbc;color:#d84315}
.warning{
  background:#fff3e0;border-left:4px solid #e65100;padding:10px 14px;
  border-radius:0 var(--radius) var(--radius) 0;margin:10px 0;
  font-size:.9rem;color:#bf360c;
}
.method-list{counter-reset:meth;list-style:none;padding-left:0}
.method-list li{counter-increment:meth;padding:6px 0 6px 32px;position:relative}
.method-list li::before{
  content:counter(meth);position:absolute;left:0;top:6px;
  background:var(--accent);color:#fff;width:22px;height:22px;
  border-radius:50%;text-align:center;line-height:22px;font-size:.78rem;font-weight:700;
}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
footer{text-align:center;padding:24px 16px;color:var(--muted);font-size:.8rem}
@media(max-width:600px){
  header h1{font-size:1.5rem}
  .tab{padding:18px 14px;margin:0 8px}
  nav{padding:0 8px 10px;gap:3px}
  nav button{padding:7px 10px;font-size:.76rem}
  .container{padding:10px}
  .badge{top:10px;right:10px;font-size:.68rem}
  .theme-toggle{top:10px;left:10px}
  .two-col{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Changer le theme">&#x1F313;</button>
  <span class="badge">4eme</span>
  <h1>Fractions : operations</h1>
  <p>Cours interactif &mdash; Cycle 4</p>
</header>
<nav id="tabs-nav"></nav>
<div class="container" id="tabs-container"></div>
<footer>Cours interactif &mdash; Mathematiques 4eme &mdash; Fractions : operations</footer>

<script>
/* ========== GLOBALS ========== */
var TAB_NAMES=["Rappels","Addition / Soustraction","Multiplication","Division",
               "Problemes","Exercices","QCM"];
var tabsLoaded=new Array(TAB_NAMES.length).fill(false);
var currentTab=0;

/* Fraction HTML helpers */
function F(n,d){
  return '<span class="frac"><span class="num">'+n+'</span><span class="den">'+d+'</span></span>';
}
function FB(n,d){
  return '<span class="frac big-frac"><span class="num">'+n+'</span><span class="den">'+d+'</span></span>';
}

/* Math helpers */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}

/* Read CSS custom properties for canvas drawing */
function getCSS(v){
  try{return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
  catch(e){return '';}
}

/* Theme toggle */
function toggleTheme(){
  var r=document.documentElement;
  if(r.getAttribute('data-theme')==='dark') r.setAttribute('data-theme','light');
  else r.setAttribute('data-theme','dark');
  /* Redraw all loaded canvases */
  tabsLoaded.forEach(function(loaded,i){
    if(loaded){var c=document.getElementById('canvas-'+i);if(c) initCanvas(i);}
  });
}

/* ========== NAV / TABS SETUP ========== */
(function buildNav(){
  var nav=document.getElementById('tabs-nav');
  var cont=document.getElementById('tabs-container');
  TAB_NAMES.forEach(function(name,i){
    var b=document.createElement('button');
    b.textContent=name;
    b.onclick=function(){showTab(i);};
    if(i===0) b.className='active';
    nav.appendChild(b);
    var d=document.createElement('div');
    d.className='tab'+(i===0?' active':'');
    d.id='tab-'+i;
    cont.appendChild(d);
  });
  initSection(0);
})();

function showTab(i){
  document.querySelectorAll('nav button').forEach(function(b,j){
    b.className=(j===i)?'active':'';
  });
  document.querySelectorAll('.tab').forEach(function(t,j){
    t.className=(j===i)?'tab active':'tab';
  });
  currentTab=i;
  if(!tabsLoaded[i]) initSection(i);
}

function initSection(i){
  tabsLoaded[i]=true;
  var el=document.getElementById('tab-'+i);
  switch(i){
    case 0:buildRappels(el);break;
    case 1:buildAddSub(el);break;
    case 2:buildMultiplication(el);break;
    case 3:buildDivision(el);break;
    case 4:buildProblemes(el);break;
    case 5:buildExercices(el);break;
    case 6:buildQCM(el);break;
  }
}

/* Canvas init dispatcher */
function initCanvas(i){
  if(i===0){
    var n=parseInt(document.getElementById('vis-num').value)||3;
    var d=parseInt(document.getElementById('vis-den').value)||4;
    drawVis(n,d);
  }
  if(i===1) drawAddBars();
  if(i===2) drawRectArea();
  if(i===3) drawDivisionVis();
}

/* ======================================================
   TAB 0 : RAPPELS
   ====================================================== */
function buildRappels(el){
  el.innerHTML=
  '<h2>Rappels sur les fractions</h2>'+

  '<h3>1. Ecriture fractionnaire</h3>'+
  '<p>Une <strong>fraction</strong> est le quotient de deux nombres entiers. '+
  'On ecrit '+F('a','b')+' ou <strong>a</strong> est le <em>numerateur</em> '+
  'et <strong>b</strong> le <em>denominateur</em> (b &ne; 0).</p>'+
  '<div class="rule-box"><strong>Vocabulaire :</strong><br>'+
  '&bull; Le <em>numerateur</em> indique combien de parts on prend.<br>'+
  '&bull; Le <em>denominateur</em> indique en combien de parts egales l\'unite est divisee.<br>'+
  '&bull; Le denominateur ne peut <strong>jamais</strong> etre egal a zero.</div>'+
  '<div class="example"><div class="label">Exemples</div>'+
  '<p>'+F('3','4')+' = 3 &divide; 4 = 0,75 &nbsp;&mdash;&nbsp; '+
  F('7','2')+' = 3,5 &nbsp;&mdash;&nbsp; '+
  F('5','1')+' = 5 &nbsp;&mdash;&nbsp; '+
  F('1','3')+' &asymp; 0,333...</p>'+
  '<p>Une fraction est superieure a 1 lorsque le numerateur est plus grand que le denominateur : '+
  F('9','4')+' = 2,25 &gt; 1</p></div>'+

  '<h3>2. Fractions egales</h3>'+
  '<div class="rule-box"><strong>Propriete fondamentale :</strong> On ne change pas la valeur d\'une '+
  'fraction en multipliant (ou divisant) le numerateur et le denominateur par un meme nombre non nul.<br>'+
  FB('a','b')+' = '+FB('a &times; k','b &times; k')+' pour tout k &ne; 0</div>'+
  '<div class="example"><div class="label">Exemples</div>'+
  '<p>'+F('2','3')+' = '+F('2 &times; 4','3 &times; 4')+' = '+F('8','12')+
  ' &nbsp;&mdash;&nbsp; '+F('5','10')+' = '+F('5 &divide; 5','10 &divide; 5')+' = '+F('1','2')+'</p>'+
  '<p>On peut verifier sur la droite graduee : '+F('2','3')+' et '+F('8','12')+
  ' designent le meme point.</p></div>'+

  '<h3>3. Simplification de fractions</h3>'+
  '<p>Simplifier une fraction, c\'est diviser le numerateur et le denominateur par un meme '+
  'diviseur commun. Le but est d\'obtenir la <strong>fraction irreductible</strong>.</p>'+
  '<div class="rule-box"><strong>Fraction irreductible :</strong> Une fraction est irreductible '+
  'lorsque le numerateur et le denominateur n\'ont aucun diviseur commun autre que 1. '+
  'Pour l\'obtenir, on divise par le <strong>PGCD</strong>.</div>'+
  '<div class="example"><div class="label">Exemple detaille</div>'+
  '<div class="step">Simplifier '+F('18','24')+'</div>'+
  '<div class="step">Diviseurs de 18 : 1, 2, 3, 6, 9, 18</div>'+
  '<div class="step">Diviseurs de 24 : 1, 2, 3, 4, 6, 8, 12, 24</div>'+
  '<div class="step">PGCD(18, 24) = 6</div>'+
  '<div class="step">'+F('18','24')+' = '+F('18 &divide; 6','24 &divide; 6')+' = '+F('3','4')+
  ' &larr; fraction irreductible</div></div>'+

  '<h3>4. PGCD &mdash; rappel de la methode</h3>'+
  '<p>Le <strong>PGCD</strong> (Plus Grand Commun Diviseur) de deux entiers est le plus grand nombre '+
  'qui divise les deux. On utilise l\'<em>algorithme d\'Euclide</em> (divisions successives) :</p>'+
  '<div class="example"><div class="label">Methode : algorithme d\'Euclide</div>'+
  '<p>PGCD(48, 18) :</p>'+
  '<div class="step">48 = 18 &times; 2 + <strong>12</strong></div>'+
  '<div class="step">18 = 12 &times; 1 + <strong>6</strong></div>'+
  '<div class="step">12 = 6 &times; 2 + <strong>0</strong> &larr; le reste est nul</div>'+
  '<div class="step">Le dernier reste non nul est <strong>6</strong>, donc PGCD(48, 18) = 6</div></div>'+
  '<div class="example"><div class="label">Autre exemple</div>'+
  '<p>PGCD(56, 42) :</p>'+
  '<div class="step">56 = 42 &times; 1 + 14</div>'+
  '<div class="step">42 = 14 &times; 3 + 0</div>'+
  '<div class="step">PGCD(56, 42) = <strong>14</strong></div></div>'+

  '<h3>5. Outil interactif : simplification</h3>'+
  '<p>Entre un numerateur et un denominateur pour voir la simplification :</p>'+
  '<div class="exercise-input">'+
  '<input id="simp-num" type="number" value="12" min="1" max="999"> / '+
  '<input id="simp-den" type="number" value="18" min="1" max="999"> '+
  '<button class="btn" onclick="doSimplify()">Simplifier</button></div>'+
  '<div id="simp-result" class="feedback"></div>'+

  '<h3>6. Comparaison de fractions</h3>'+
  '<div class="rule-box"><strong>Pour comparer deux fractions</strong>, on les reduit au meme '+
  'denominateur puis on compare les numerateurs.</div>'+
  '<div class="example"><div class="label">Exemple</div>'+
  '<p>Comparer '+F('3','4')+' et '+F('5','6')+' :</p>'+
  '<div class="step">Denominateur commun : 12</div>'+
  '<div class="step">'+F('3','4')+' = '+F('9','12')+' et '+F('5','6')+' = '+F('10','12')+'</div>'+
  '<div class="step">9 &lt; 10 donc '+F('3','4')+' &lt; '+F('5','6')+'</div></div>'+

  '<h3>7. Visualisation interactive</h3>'+
  '<p>Deplace les curseurs pour voir la fraction sur le disque et la barre :</p>'+
  '<div class="exercise-input">'+
  '<label>Numerateur : <input id="vis-num" type="range" min="0" max="8" value="3"></label> &nbsp;'+
  '<label>Denominateur : <input id="vis-den" type="range" min="1" max="12" value="4"></label> &nbsp;'+
  '<span id="vis-label" style="font-weight:700">'+F('3','4')+'</span></div>'+
  '<canvas id="canvas-0" width="500" height="220"></canvas>';

  document.getElementById('vis-num').oninput=
  document.getElementById('vis-den').oninput=function(){updateVis();};
  setTimeout(function(){initCanvas(0);},50);
}

function doSimplify(){
  var n=parseInt(document.getElementById('simp-num').value)||1;
  var d=parseInt(document.getElementById('simp-den').value)||1;
  var res=document.getElementById('simp-result');
  if(d===0){res.innerHTML='<span class="wrong">Le denominateur ne peut pas etre 0 !</span>';return;}
  var g=gcd(n,d);
  if(g===1) res.innerHTML=F(n,d)+' est deja <strong>irreductible</strong>.';
  else res.innerHTML='PGCD('+n+', '+d+') = '+g+' &rarr; '+F(n,d)+' = '+F(n/g,d/g);
}

function updateVis(){
  var n=parseInt(document.getElementById('vis-num').value);
  var d=parseInt(document.getElementById('vis-den').value);
  document.getElementById('vis-label').innerHTML=F(n,d);
  drawVis(n,d);
}

function drawVis(n,d){
  var c=document.getElementById('canvas-0');if(!c)return;
  var ctx=c.getContext('2d');
  var W=c.width,H=c.height;
  ctx.clearRect(0,0,W,H);
  var bg=getCSS('--surface2')||'#ebe6de';
  var acc=getCSS('--accent')||'#a0522d';
  var brd=getCSS('--border')||'#d4c8b8';
  var txt=getCSS('--text')||'#2c2418';
  var hd=getCSS('--heading')||'#8b4513';
  /* --- Disc --- */
  var cx=120,cy=105,r=80;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
  ctx.strokeStyle=brd;ctx.lineWidth=1.5;ctx.stroke();
  for(var i=0;i<d;i++){
    var angle=-Math.PI/2+i*2*Math.PI/d;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+r*Math.cos(angle),cy+r*Math.sin(angle));
    ctx.strokeStyle=brd;ctx.stroke();
  }
  for(var i=0;i<Math.min(n,d);i++){
    var a1=-Math.PI/2+i*2*Math.PI/d;
    var a2=-Math.PI/2+(i+1)*2*Math.PI/d;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a1,a2);ctx.closePath();
    ctx.fillStyle=acc;ctx.globalAlpha=.55;ctx.fill();ctx.globalAlpha=1;
  }
  /* --- Bar --- */
  var bx=260,by=50,bw=220,bh=40;
  ctx.fillStyle=bg;ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle=brd;ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,bh);
  var partW=bw/d;
  for(var i=0;i<Math.min(n,d);i++){
    ctx.fillStyle=acc;ctx.globalAlpha=.55;
    ctx.fillRect(bx+i*partW,by,partW,bh);ctx.globalAlpha=1;
  }
  for(var i=1;i<d;i++){
    ctx.beginPath();ctx.moveTo(bx+i*partW,by);
    ctx.lineTo(bx+i*partW,by+bh);ctx.strokeStyle=brd;ctx.stroke();
  }
  /* --- Decimal bar (proportion) --- */
  var pct=d>0?Math.min(n/d,1):0;
  var dby=120,dbh=20;
  ctx.fillStyle=bg;ctx.fillRect(bx,dby,bw,dbh);ctx.strokeStyle=brd;ctx.strokeRect(bx,dby,bw,dbh);
  ctx.fillStyle=acc;ctx.globalAlpha=.55;ctx.fillRect(bx,dby,bw*pct,dbh);ctx.globalAlpha=1;
  /* --- Labels --- */
  ctx.fillStyle=txt;ctx.font='600 14px Nunito Sans,sans-serif';ctx.textAlign='center';
  ctx.fillText(n+'/'+d+(n>d?' (> 1)':''),bx+bw/2,by+bh+20);
  ctx.fillText('Disque',cx,cy+r+22);
  ctx.fillText('Barre fractionnee',bx+bw/2,by-10);
  var decVal=d>0?(n/d).toFixed(3):'--';
  ctx.fillText('Valeur decimale : '+decVal,bx+bw/2,dby+dbh+20);
  ctx.fillText('Proportion',bx+bw/2,dby-6);
}

function checkFrac(inpN,inpD,expectN,expectD,fbId){
  var n=parseInt(document.getElementById(inpN).value);
  var d=parseInt(document.getElementById(inpD).value);
  var fb=document.getElementById(fbId);
  if(isNaN(n)||isNaN(d)||d===0){
    fb.className='feedback wrong';
    fb.textContent='Remplis les deux champs (denominateur ≠ 0).';return;
  }
  if(n*expectD===expectN*d){
    fb.className='feedback correct';
    fb.textContent='Bravo, c\'est correct !';
  } else {
    fb.className='feedback wrong';
    fb.textContent='Ce n\'est pas la bonne reponse. Reessaie !';
  }
}

function drawAddBars(){
  var c=document.getElementById('canvas-1');if(!c)return;
  var ctx=c.getContext('2d');var W=c.width,H=c.height;
  ctx.clearRect(0,0,W,H);
  var bg=getCSS('--surface2')||'#ebe6de';
  var acc=getCSS('--accent')||'#a0522d';
  var brd=getCSS('--border')||'#d4c8b8';
  var txt=getCSS('--text')||'#2c2418';
  var bx=60,bw=380,bh=32;
  var fracs=[{n:2,d:3,label:'2/3'},{n:3,d:4,label:'3/4'},{n:5,d:6,label:'5/6'}];
  fracs.forEach(function(fr,idx){
    var by=25+idx*60;
    ctx.fillStyle=bg;ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle=brd;ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,bh);
    var pw=bw/fr.d;
    for(var i=0;i<fr.n;i++){
      ctx.fillStyle=acc;ctx.globalAlpha=.5;
      ctx.fillRect(bx+i*pw,by,pw,bh);ctx.globalAlpha=1;
    }
    for(var i=1;i<fr.d;i++){
      ctx.beginPath();ctx.moveTo(bx+i*pw,by);
      ctx.lineTo(bx+i*pw,by+bh);ctx.strokeStyle=brd;ctx.stroke();
    }
    ctx.fillStyle=txt;ctx.font='600 13px Nunito Sans,sans-serif';
    ctx.textAlign='right';ctx.fillText(fr.label+' =',bx-8,by+22);
    /* Decimal value at right */
    ctx.textAlign='left';
    ctx.fillText((fr.n/fr.d).toFixed(3),bx+bw+10,by+22);
  });
  ctx.textAlign='center';ctx.font='600 13px Nunito Sans,sans-serif';
  ctx.fillStyle=txt;
  ctx.fillText('On constate : 2/3 < 3/4 < 5/6',bx+bw/2,210);
}

function drawRectArea(){
  var c=document.getElementById('canvas-2');if(!c)return;
  var ctx=c.getContext('2d');var W=c.width,H=c.height;ctx.clearRect(0,0,W,H);
  var bg=getCSS('--surface2')||'#ebe6de';
  var acc=getCSS('--accent')||'#a0522d';
  var brd=getCSS('--border')||'#d4c8b8';
  var txt=getCSS('--text')||'#2c2418';
  var ox=90,oy=30,sw=300,sh=210;
  var cw=sw/3,rh=sh/4;
  /* Full grid background */
  ctx.fillStyle=bg;ctx.fillRect(ox,oy,sw,sh);
  /* Colored area: 2 cols x 3 rows = 6 out of 12 cells */
  for(var r=0;r<3;r++){
    for(var cc=0;cc<2;cc++){
      ctx.fillStyle=acc;ctx.globalAlpha=.45;
      ctx.fillRect(ox+cc*cw,oy+r*rh,cw,rh);ctx.globalAlpha=1;
    }
  }
  /* Grid lines */
  ctx.strokeStyle=brd;ctx.lineWidth=1;
  for(var i=0;i<=3;i++){
    ctx.beginPath();ctx.moveTo(ox+i*cw,oy);ctx.lineTo(ox+i*cw,oy+sh);ctx.stroke();
  }
  for(var i=0;i<=4;i++){
    ctx.beginPath();ctx.moveTo(ox,oy+i*rh);ctx.lineTo(ox+sw,oy+i*rh);ctx.stroke();
  }
  ctx.strokeStyle=txt;ctx.lineWidth=2;ctx.strokeRect(ox,oy,sw,sh);
  /* Highlight boundary of colored zone */
  ctx.strokeStyle=acc;ctx.lineWidth=2.5;
  ctx.strokeRect(ox,oy,2*cw,3*rh);
  /* Labels */
  ctx.fillStyle=txt;ctx.font='600 13px Nunito Sans,sans-serif';ctx.textAlign='center';
  ctx.fillText('← 2/3 de la largeur →',ox+cw,oy+sh+20);
  ctx.save();ctx.translate(ox-20,oy+rh*1.5);ctx.rotate(-Math.PI/2);
  ctx.fillText('3/4 de la hauteur',0,0);ctx.restore();
  /* Result text */
  ctx.fillStyle=acc;ctx.font='700 14px Nunito Sans,sans-serif';
  ctx.fillText('Cases colorees : 2×3 = 6',ox+sw/2,oy+sh+44);
  ctx.fillText('Cases totales : 3×4 = 12',ox+sw/2,oy+sh+62);
  ctx.fillText('Aire = 6/12 = 1/2',ox+sw/2,oy+sh+82);
}

function drawDivisionVis(){
  var c=document.getElementById('canvas-3');if(!c)return;
  var ctx=c.getContext('2d');var W=c.width,H=c.height;ctx.clearRect(0,0,W,H);
  var bg=getCSS('--surface2')||'#ebe6de';
  var acc=getCSS('--accent')||'#a0522d';
  var brd=getCSS('--border')||'#d4c8b8';
  var txt=getCSS('--text')||'#2c2418';
  var bx=60,bw=380,bh=40;
  /* Full bar divided in 4 */
  var by=25;
  ctx.fillStyle=bg;ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle=brd;ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,bh);
  var pw=bw/4;
  /* Color 3 parts */
  for(var i=0;i<3;i++){
    ctx.fillStyle=acc;ctx.globalAlpha=.5;
    ctx.fillRect(bx+i*pw,by,pw,bh);ctx.globalAlpha=1;
  }
  /* Dividers and bracket markers */
  var colors=['#c62828','#2e7d32','#1565c0'];
  for(var i=0;i<4;i++){
    ctx.beginPath();ctx.moveTo(bx+i*pw,by);
    ctx.lineTo(bx+i*pw,by+bh);ctx.strokeStyle=brd;ctx.lineWidth=1.5;ctx.stroke();
  }
  /* Brackets for each 1/4 */
  for(var i=0;i<3;i++){
    var x1=bx+i*pw+2,x2=bx+(i+1)*pw-2,bby=by+bh+12;
    ctx.strokeStyle=colors[i];ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x1,bby);ctx.lineTo(x1,bby+8);
    ctx.lineTo(x2,bby+8);ctx.lineTo(x2,bby);ctx.stroke();
    ctx.fillStyle=colors[i];ctx.font='700 12px Nunito Sans,sans-serif';ctx.textAlign='center';
    ctx.fillText('1/4',(x1+x2)/2,bby+24);
  }
  ctx.fillStyle=txt;ctx.font='600 13px Nunito Sans,sans-serif';ctx.textAlign='right';
  ctx.fillText('3/4 :',bx-8,by+26);
  ctx.textAlign='center';
  ctx.fillText('3/4 ÷ 1/4 = 3 (on peut placer 3 parts de 1/4 dans 3/4)',bx+bw/2,by+bh+54);
}

    '<h4>Question '+(i+1)+' / '+qcmData.length+'</h4><p>'+item.q+'</p>';

  for(var j=0;j<qcmData[qi].opts.length;j++){
    var lbl=document.getElementById('qo-'+qi+'-'+j);
    lbl.className=(j===oi)?'qcm-option selected':'qcm-option';
  }
}

function gradeQCM(){
  var score=0;
  qcmData.forEach(function(item,i){
    for(var j=0;j<item.opts.length;j++){
      var lbl=document.getElementById('qo-'+i+'-'+j);
      if(j===item.ans){
        lbl.className='qcm-option correct-answer';
      } else if(j===qcmAnswers[i]&&j!==item.ans){
        lbl.className='qcm-option wrong-answer';
      } else {
        lbl.className='qcm-option';
      }
    }
    if(qcmAnswers[i]===item.ans) score++;
  });
  var pct=Math.round(100*score/qcmData.length);
  var msg;
  if(pct>=90) msg='Excellent travail ! Tu maitrises parfaitement les fractions !';
  else if(pct>=75) msg='Tres bien ! Quelques petits points a revoir.';
  else if(pct>=55) msg='Assez bien. Revois les regles avant de recommencer.';
  else if(pct>=35) msg='Des efforts sont necessaires. Relis bien le cours.';
  else msg='Reprends le cours depuis le debut et refais les exercices.';
  document.getElementById('qcm-score').innerHTML=
    '<div class="score-box"><div class="score-num">'+score+' / '+qcmData.length+
    '</div><p>'+pct+' % &mdash; '+msg+'</p></div>';
}

function resetQCM(){
  qcmAnswers=new Array(qcmData.length).fill(-1);
  qcmData.forEach(function(item,i){
    for(var j=0;j<item.opts.length;j++){
      document.getElementById('qo-'+i+'-'+j).className='qcm-option';
    }
  });
  document.getElementById('qcm-score').innerHTML='';
}
</script>
