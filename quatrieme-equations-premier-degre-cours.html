<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Équations du premier degré — 4ème</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f2ed;--surface:#ffffff;--surface2:#ebe6de;--text:#2c2418;
  --heading:#8b4513;--muted:#6b5a48;--border:#d4c8b8;--accent:#a0522d;
  --accent-light:#faf5ef;--radius:10px;--shadow:0 2px 8px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161210;--surface:#221c18;--surface2:#302820;--text:#ddd0c0;
    --heading:#e0a868;--muted:#9a8878;--border:#403428;--accent:#d08840;
    --accent-light:#1e1610;--shadow:0 2px 8px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#161210;--surface:#221c18;--surface2:#302820;--text:#ddd0c0;
  --heading:#e0a868;--muted:#9a8878;--border:#403428;--accent:#d08840;
  --accent-light:#1e1610;--shadow:0 2px 8px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Nunito Sans',sans-serif;background:var(--bg);color:var(--text);
  line-height:1.7;min-height:100vh;padding:0 16px;
}
h1,h2,h3{font-family:'Cormorant Garamond',serif;color:var(--heading);line-height:1.3;}
.container{max-width:860px;margin:0 auto;padding:24px 0 48px;}

/* Header */
header{text-align:center;padding:32px 0 16px;position:relative;}
header h1{font-size:2rem;font-weight:700;margin-bottom:4px;}
header p{color:var(--muted);font-size:.95rem;}
.badge{
  display:inline-block;background:var(--accent);color:#fff;font-size:.75rem;
  font-weight:700;padding:3px 12px;border-radius:20px;margin-bottom:10px;letter-spacing:.5px;
}
.theme-toggle{
  position:absolute;top:32px;right:0;background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:4px 12px;cursor:pointer;font-size:1.1rem;line-height:1;
}

/* Tabs */
.tabs{
  display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--border);
  margin:20px 0 0;padding-bottom:0;
}
.tab-btn{
  background:none;border:none;padding:8px 14px;font-family:'Nunito Sans',sans-serif;
  font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;
  border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .2s,border-color .2s;
  white-space:nowrap;
}
.tab-btn:hover{color:var(--heading);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-content{display:none;padding:24px 0;animation:fadeIn .3s ease;}
.tab-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 24px;margin:16px 0;box-shadow:var(--shadow);
}
.definition{
  border-left:4px solid var(--accent);background:var(--accent-light);
  padding:16px 20px;border-radius:0 var(--radius) var(--radius) 0;margin:16px 0;
}
.definition strong{color:var(--heading);}
.method{
  background:var(--surface);border:2px dashed var(--accent);border-radius:var(--radius);
  padding:16px 20px;margin:16px 0;
}
.method h3{font-size:1.1rem;margin-bottom:8px;}
.example{background:var(--surface2);border-radius:var(--radius);padding:16px 20px;margin:12px 0;}
.example h3{font-size:1rem;margin-bottom:6px;}
.warning{
  background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius);
  padding:14px 18px;margin:14px 0;font-size:.92rem;
}
.warning strong{color:var(--accent);}
.eq{
  font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:600;
  color:var(--heading);text-align:center;margin:10px 0;letter-spacing:.5px;
}
.step{display:flex;align-items:flex-start;gap:10px;margin:6px 0;}
.step-num{
  background:var(--accent);color:#fff;width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:.75rem;
  font-weight:700;flex-shrink:0;margin-top:2px;
}

/* Exercises */
.exercise{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 20px;margin:14px 0;
}
.exercise h3{font-size:1rem;color:var(--accent);margin-bottom:8px;}
.exercise input[type="number"],.exercise input[type="text"],
.interactive-zone input[type="text"],.interactive-zone input[type="number"]{
  width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface2);color:var(--text);font-size:.95rem;text-align:center;
  font-family:'Nunito Sans',sans-serif;
}
.exercise button,.btn{
  background:var(--accent);color:#fff;border:none;border-radius:6px;
  padding:6px 16px;font-family:'Nunito Sans',sans-serif;font-size:.85rem;
  font-weight:600;cursor:pointer;transition:opacity .2s;
}
.btn:hover{opacity:.85;}
.feedback{margin-top:8px;padding:8px 12px;border-radius:6px;font-size:.9rem;font-weight:600;}
.feedback.correct{background:#e8f5e9;color:#2e7d32;}
.feedback.wrong{background:#fbe9e7;color:#c62828;}
:root[data-theme="dark"] .feedback.correct,
:root:not([data-theme="light"]) .feedback.correct{background:#1b3a1b;color:#81c784;}
:root[data-theme="dark"] .feedback.wrong,
:root:not([data-theme="light"]) .feedback.wrong{background:#3a1b1b;color:#e57373;}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .feedback.correct{background:#1b3a1b;color:#81c784;}
  :root:not([data-theme="light"]) .feedback.wrong{background:#3a1b1b;color:#e57373;}
}

/* Details / corrections */
details{margin:10px 0;}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem;padding:4px 0;}
details summary:hover{text-decoration:underline;}
details .correction{
  padding:10px 16px;background:var(--accent-light);border-radius:0 0 var(--radius) var(--radius);
  margin-top:4px;font-size:.92rem;line-height:1.8;
}
.correction .eq{font-size:1.05rem;text-align:left;margin:4px 0;}

/* Canvas */
canvas{
  display:block;margin:12px auto;border-radius:var(--radius);border:1px solid var(--border);
  max-width:100%;background:var(--surface);
}

/* QCM */
.qcm-q{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 20px;margin:12px 0;
}
.qcm-q p.q-text{font-weight:600;margin-bottom:8px;}
.qcm-q label{
  display:block;padding:6px 12px;margin:4px 0;border-radius:6px;cursor:pointer;
  transition:background .15s;font-size:.93rem;
}
.qcm-q label:hover{background:var(--surface2);}
.qcm-q input[type="radio"]{margin-right:8px;accent-color:var(--accent);}
.qcm-q.answered-right{border-color:#4caf50;}
.qcm-q.answered-wrong{border-color:#e53935;}
.score-box{
  text-align:center;padding:24px;background:var(--surface);border:2px solid var(--accent);
  border-radius:var(--radius);margin:20px 0;font-size:1.2rem;font-weight:700;color:var(--heading);
}

/* Tags */
.level-tag{
  display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;
  border-radius:10px;margin-left:6px;vertical-align:middle;
}
.level-tag.vert{background:#c8e6c9;color:#2e7d32;}
.level-tag.orange{background:#ffe0b2;color:#e65100;}
.level-tag.rouge{background:#ffcdd2;color:#c62828;}

/* Interactive zones */
.interactive-zone{
  background:var(--surface2);border-radius:var(--radius);padding:16px;margin:14px 0;text-align:center;
}
.interactive-zone button{margin:4px;}
.flex-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;}

/* Progress bar for QCM */
.progress-bar{
  height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:12px 0;
}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease;}

/* Responsive */
@media(max-width:600px){
  header h1{font-size:1.5rem;}
  .tab-btn{padding:6px 8px;font-size:.78rem;}
  .card,.exercise,.qcm-q{padding:14px 16px;}
  .container{padding:16px 0 40px;}
  body{padding:0 16px;}
  .eq{font-size:1.05rem;}
}
</style>
</head>
<body>
<div class="container">
<header>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Changer de theme">&#9789;</button>
  <span class="badge">4eme</span>
  <h1>Equations du premier degre</h1>
  <p>Cours interactif &mdash; College</p>
</header>
<nav class="tabs" id="tabNav"></nav>
<div id="tabPanels"></div>
</div>

<script>
/* ===== Theme ===== */
function toggleTheme(){
  var r=document.documentElement;
  var cur=r.getAttribute('data-theme');
  r.setAttribute('data-theme', cur==='dark' ? 'light' : 'dark');
}
function cssVar(v){
  return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
}

/* ===== Tab System ===== */
var TAB_NAMES=["Vocabulaire","Resoudre","Avec fractions","Avec parentheses","Mise en equation","Exercices","QCM"];
var initialized=[];
var nav=document.getElementById('tabNav');
var panels=document.getElementById('tabPanels');

TAB_NAMES.forEach(function(name,i){
  var btn=document.createElement('button');
  btn.className='tab-btn';
  btn.textContent=name;
  btn.onclick=function(){showTab(i);};
  nav.appendChild(btn);
  var div=document.createElement('div');
  div.className='tab-content';
  div.id='tab'+i;
  panels.appendChild(div);
});

function showTab(i){
  document.querySelectorAll('.tab-btn').forEach(function(b,j){b.classList.toggle('active',j===i);});
  document.querySelectorAll('.tab-content').forEach(function(d,j){d.classList.toggle('active',j===i);});
  if(!initialized[i]){initSection(i);initialized[i]=true;}
}

/* ===== Lazy Section Builders ===== */
function initSection(idx){
  var el=document.getElementById('tab'+idx);
  switch(idx){
    case 0: buildVocabulaire(el); break;
    case 1: buildResoudre(el); break;
    case 2: buildFractions(el); break;
    case 3: buildParentheses(el); break;
    case 4: buildMiseEnEquation(el); break;
    case 5: buildExercices(el); break;
    case 6: buildQCM(el); break;
  }
}

/* ===== Shared helpers ===== */
function simpleFb(inId, fbId, answer){
  var v=parseFloat(document.getElementById(inId).value);
  var fb=document.getElementById(fbId);
  fb.style.display='block';
  if(v===answer){
    fb.className='feedback correct';
    fb.textContent='Bravo ! La reponse est '+answer+'.';
  } else {
    fb.className='feedback wrong';
    fb.textContent='Ce n\'est pas la bonne reponse. Reessaie !';
  }
}

function makeFbDiv(id){
  return '<div id="'+id+'" class="feedback" style="display:none"></div>';
}

/* ================================================================
   TAB 0 : VOCABULAIRE
   ================================================================ */
function buildVocabulaire(el){
  el.innerHTML=
  '<h2>Vocabulaire des equations</h2>'+
  '<p>Avant de resoudre une equation, il faut bien comprendre le vocabulaire.</p>'+

  '<div class="definition">'+
  '<strong>Equation :</strong> Une equation est une egalite comportant un ou plusieurs '+
  'nombres inconnus, souvent notes <em>x</em>. Resoudre une equation, c\'est trouver la '+
  '(ou les) valeur(s) de l\'inconnue qui rendent l\'egalite vraie.</div>'+

  '<div class="definition">'+
  '<strong>Inconnue :</strong> La lettre (souvent <em>x</em>) qui represente le nombre '+
  'que l\'on cherche. On peut aussi utiliser <em>y</em>, <em>t</em>, etc.</div>'+

  '<div class="definition">'+
  '<strong>Membres :</strong> Dans l\'equation <em>3x + 5 = 2x &minus; 1</em>, le '+
  '<strong>membre de gauche</strong> est <em>3x + 5</em> et le <strong>membre de droite</strong> '+
  'est <em>2x &minus; 1</em>. Le signe <em>=</em> separe les deux membres.</div>'+

  '<div class="definition">'+
  '<strong>Solution :</strong> La valeur de <em>x</em> qui verifie l\'egalite. On dit '+
  'que ce nombre <em>est solution</em> de l\'equation.</div>'+

  '<div class="definition">'+
  '<strong>Verification :</strong> On remplace <em>x</em> par la valeur trouvee dans les deux '+
  'membres. Si les resultats sont egaux, la solution est correcte.</div>'+

  '<div class="card">'+
  '<h3>Schema : identifier les elements</h3>'+
  '<p>L\'equation <span class="eq">5x &minus; 3 = 2x + 9</span></p>'+
  '<canvas id="cvVoc" width="520" height="140"></canvas>'+
  '</div>'+

  '<div class="warning"><strong>Attention :</strong> Une equation n\'est pas un calcul. '+
  'On ne peut pas lire de gauche a droite comme une operation. C\'est une balance : '+
  'les deux cotes doivent etre egaux.</div>'+

  '<h3 style="margin-top:24px;">Exercices interactifs</h3>'+

  '<div class="exercise"><h3>Exercice 1 &mdash; Tester si un nombre est solution</h3>'+
  '<p>Equation : <span class="eq">2x + 3 = 11</span></p>'+
  '<p>Est-ce que <em>x</em> = <input type="number" id="vocIn1" value="4" style="width:60px"> est solution ?</p>'+
  '<button class="btn" onclick="checkVoc1()">Verifier</button>'+
  makeFbDiv('vocFb1')+'</div>'+

  '<div class="exercise"><h3>Exercice 2 &mdash; Trouver la solution</h3>'+
  '<p>Equation : <span class="eq">3x &minus; 6 = 9</span></p>'+
  '<p>x = <input type="number" id="vocIn2" style="width:60px"> '+
  '<button class="btn" onclick="checkVoc2()">Verifier</button></p>'+
  makeFbDiv('vocFb2')+
  '<details><summary>Voir la correction</summary><div class="correction">'+
  '<div class="eq">3x = 9 + 6 = 15</div>'+
  '<div class="eq">x = 15 / 3 = 5</div></div></details></div>'+

  '<div class="exercise"><h3>Exercice 3 &mdash; Identifier les membres</h3>'+
  '<p>Equation : <span class="eq">7 &minus; 4x = 2x + 1</span></p>'+
  '<p>Membre de gauche : <input type="text" id="vocIn3" style="width:140px" placeholder="ex: 7 - 4x"> '+
  '<button class="btn" onclick="checkVoc3()">Verifier</button></p>'+
  makeFbDiv('vocFb3')+'</div>'+

  '<div class="exercise"><h3>Exercice 4 &mdash; Verification interactive</h3>'+
  '<p>Equation : <span class="eq">5x &minus; 3 = 2x + 9</span></p>'+
  '<p>On vous dit que x = 4. Calculez chaque membre :</p>'+
  '<p>Membre gauche : 5 &times; 4 &minus; 3 = <input type="number" id="vocIn4a" style="width:60px"></p>'+
  '<p>Membre droit : 2 &times; 4 + 9 = <input type="number" id="vocIn4b" style="width:60px"></p>'+
  '<button class="btn" onclick="checkVoc4()">Verifier</button>'+
  makeFbDiv('vocFb4')+'</div>';

  setTimeout(drawVocCanvas, 50);
}

function drawVocCanvas(){
  var c=document.getElementById('cvVoc');
  if(!c) return;
  var ctx=c.getContext('2d');
  var w=c.width, h=c.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle=cssVar('--surface');
  ctx.fillRect(0,0,w,h);
  /* Main equation */
  ctx.font='700 22px Cormorant Garamond, serif';
  ctx.textAlign='center';
  ctx.fillStyle=cssVar('--heading');
  ctx.fillText('5x - 3  =  2x + 9', w/2, 36);
  /* Arrows and labels */
  ctx.font='600 13px Nunito Sans, sans-serif';
  ctx.fillStyle=cssVar('--accent');
  /* Left bracket */
  ctx.strokeStyle=cssVar('--accent');
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(110,44); ctx.lineTo(110,62); ctx.lineTo(220,62); ctx.lineTo(220,44);
  ctx.stroke();
  ctx.fillText('Membre de gauche', 165, 80);
  /* Right bracket */
  ctx.beginPath();
  ctx.moveTo(290,44); ctx.lineTo(290,62); ctx.lineTo(400,62); ctx.lineTo(400,44);
  ctx.stroke();
  ctx.fillText('Membre de droite', 345, 80);
  /* Equal sign label */
  ctx.fillStyle=cssVar('--muted');
  ctx.beginPath();
  ctx.moveTo(w/2, 44); ctx.lineTo(w/2, 95);
  ctx.strokeStyle=cssVar('--border');
  ctx.lineWidth=1;
  ctx.stroke();
  ctx.fillText('Signe egal', w/2, 108);
  /* Inconnue */
  ctx.fillStyle=cssVar('--heading');
  ctx.font='600 12px Nunito Sans, sans-serif';
  ctx.fillText('x = inconnue', w/2, 130);
}

function checkVoc1(){
  var v=parseFloat(document.getElementById('vocIn1').value);
  var fb=document.getElementById('vocFb1');
  fb.style.display='block';
  var left=2*v+3, right=11;
  if(left===right){
    fb.className='feedback correct';
    fb.textContent='Oui ! 2 x '+v+' + 3 = '+left+' = 11. C\'est solution !';
  } else {
    fb.className='feedback wrong';
    fb.textContent='Non. 2 x '+v+' + 3 = '+left+', or 11 est attendu. Pas solution.';
  }
}
function checkVoc2(){
  var v=parseFloat(document.getElementById('vocIn2').value);
  var fb=document.getElementById('vocFb2');
  fb.style.display='block';
  if(v===5){
    fb.className='feedback correct';
    fb.textContent='Bravo ! 3 x 5 - 6 = 9.';
  } else {
    fb.className='feedback wrong';
    fb.textContent='Non. 3 x '+v+' - 6 = '+(3*v-6)+', pas 9.';
  }
}
function checkVoc3(){
  var v=document.getElementById('vocIn3').value.replace(/\s/g,'').toLowerCase();
  var fb=document.getElementById('vocFb3');
  fb.style.display='block';
  if(v==='7-4x'){
    fb.className='feedback correct';
    fb.textContent='Correct ! Le membre de gauche est 7 - 4x.';
  } else {
    fb.className='feedback wrong';
    fb.textContent='Relis l\'equation : tout ce qui est a gauche du signe = forme le membre de gauche.';
  }
}
function checkVoc4(){
  var a=parseFloat(document.getElementById('vocIn4a').value);
  var b=parseFloat(document.getElementById('vocIn4b').value);
  var fb=document.getElementById('vocFb4');
  fb.style.display='block';
  if(a===17 && b===17){
    fb.className='feedback correct';
    fb.textContent='Parfait ! Les deux membres valent 17, donc x = 4 est bien solution.';
  } else if(a===17){
    fb.className='feedback wrong';
    fb.textContent='Le membre gauche est correct (17), mais verifiez le membre droit : 2 x 4 + 9 = ?';
  } else if(b===17){
    fb.className='feedback wrong';
    fb.textContent='Le membre droit est correct (17), mais verifiez le membre gauche : 5 x 4 - 3 = ?';
  } else {
    fb.className='feedback wrong';
    fb.textContent='Recalculez : 5 x 4 - 3 et 2 x 4 + 9.';
  }
}

/* ================================================================
   TAB 1 : RESOUDRE
   ================================================================ */
var bal={lx:3, ln:3, rx:1, rn:9};

function buildResoudre(el){
  el.innerHTML=
  '<h2>Resoudre une equation du premier degre</h2>'+
  '<p>Resoudre, c\'est trouver la valeur de <em>x</em> qui rend l\'egalite vraie.</p>'+

  '<div class="method"><h3>Methode en 3 etapes</h3>'+
  '<div class="step"><span class="step-num">1</span><span><strong>Transposer</strong> : '+
  'regrouper les termes en <em>x</em> d\'un cote et les nombres de l\'autre. '+
  'Quand un terme change de membre, il change de signe.</span></div>'+
  '<div class="step"><span class="step-num">2</span><span><strong>Reduire</strong> : '+
  'simplifier chaque membre (additionner les termes semblables).</span></div>'+
  '<div class="step"><span class="step-num">3</span><span><strong>Isoler <em>x</em></strong> : '+
  'diviser les deux membres par le coefficient de <em>x</em>.</span></div></div>'+

  '<div class="example"><h3>Exemple detaille : 5x &minus; 3 = 2x + 9</h3>'+
  '<p><strong>Etape 1 :</strong> On passe +2x a gauche (il devient &minus;2x) et &minus;3 a droite (il devient +3).</p>'+
  '<div class="eq">5x &minus; 2x = 9 + 3</div>'+
  '<p><strong>Etape 2 :</strong> On reduit.</p>'+
  '<div class="eq">3x = 12</div>'+
  '<p><strong>Etape 3 :</strong> On divise par 3.</p>'+
  '<div class="eq">x = 12 &divide; 3 = 4</div>'+
  '<p><strong>Verification :</strong> Gauche = 5&times;4 &minus; 3 = 17. Droite = 2&times;4 + 9 = 17. Egal !</p></div>'+

  '<div class="warning"><strong>Regle d\'or :</strong> Ce que l\'on fait a un membre, on le fait aussi a l\'autre. '+
  'Une equation est comme une balance en equilibre.</div>'+

  '<h3 style="margin-top:20px">Balance interactive</h3>'+
  '<p style="color:var(--muted);font-size:.9rem">L\'equation est <strong>3x + 3 = x + 9</strong>. '+
  'Utilisez les boutons pour isoler x pas a pas.</p>'+
  '<div class="interactive-zone" id="balanceZone">'+
  '<canvas id="cvBalance" width="520" height="230"></canvas>'+
  '<p id="balEq" class="eq" style="margin:6px 0"></p>'+
  '<div class="flex-row">'+
  '<button class="btn" onclick="balAction(\'subx\')"> &minus;x des 2 cotes</button>'+
  '<button class="btn" onclick="balAction(\'sub3\')"> &minus;3 des 2 cotes</button>'+
  '<button class="btn" onclick="balAction(\'div2\')"> &divide;2 les 2 cotes</button>'+
  '<button class="btn" onclick="balReset()" style="background:var(--muted)">Reinitialiser</button>'+
  '</div>'+
  '<div id="balFb" class="feedback" style="display:none"></div>'+
  '</div>'+

  '<h3 style="margin-top:20px">Exercices guides</h3>'+

  '<div class="exercise"><h3>Exercice 1 <span class="level-tag vert">Appliquer</span></h3>'+
  '<p>Resoudre : <span class="eq">4x + 1 = 17</span></p>'+

function balReset(){
  bal={lx:3, ln:3, rx:1, rn:9};
  balUpdate();
}

function balFmt(coef, cst){
  var parts=[];
  if(coef===1) parts.push('x');
  else if(coef===-1) parts.push('-x');
  else if(coef!==0) parts.push(coef+'x');
  if(cst>0 && parts.length) parts.push('+ '+cst);
  else if(cst<0) parts.push('- '+(-cst));
  else if(cst>0) parts.push(''+cst);
  else if(cst===0 && !parts.length) parts.push('0');
  return parts.join(' ');
}

function balUpdate(){
  var eqEl=document.getElementById('balEq');
  if(eqEl) eqEl.textContent=balFmt(bal.lx,bal.ln)+' = '+balFmt(bal.rx,bal.rn);
  drawBalance();
  var fb=document.getElementById('balFb');
  if(!fb) return;
  if(bal.lx===1 && bal.ln===0 && bal.rx===0){
    fb.style.display='block';
    fb.className='feedback correct';
    fb.textContent='Bravo ! x = '+bal.rn+' ! La balance est resolue.';
  } else if(bal.rx===0 && bal.lx>1 && bal.ln===0){
    fb.style.display='block';
    fb.className='feedback correct';
    fb.textContent='Presque ! '+bal.lx+'x = '+bal.rn+'. Divisez par '+bal.lx+' !';
  } else {
    fb.style.display='none';
  }
}

function balAction(op){
  if(op==='subx'){bal.lx--; bal.rx--;}
  else if(op==='sub3'){bal.ln-=3; bal.rn-=3;}
  else if(op==='div2'){
    if(bal.lx%2===0 && bal.ln%2===0 && bal.rx%2===0 && bal.rn%2===0){
      bal.lx/=2; bal.ln/=2; bal.rx/=2; bal.rn/=2;
    }
  }
  balUpdate();
}

function drawBalance(){
  var c=document.getElementById('cvBalance');
  if(!c) return;
  var ctx=c.getContext('2d');
  var w=c.width, h=c.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle=cssVar('--surface');
  ctx.fillRect(0,0,w,h);

  var leftW=bal.lx+bal.ln;
  var rightW=bal.rx+bal.rn;
  var tilt=Math.max(-12, Math.min(12, (rightW-leftW)*1.5));

  ctx.save();
  ctx.translate(w/2, h-30);

  /* Base triangle */
  ctx.fillStyle=cssVar('--muted');
  ctx.beginPath();
  ctx.moveTo(-30, 0); ctx.lineTo(30, 0); ctx.lineTo(0, -25); ctx.closePath();
  ctx.fill();

  /* Beam */
  ctx.save();
  ctx.rotate(tilt * Math.PI / 180);
  ctx.strokeStyle=cssVar('--heading');
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(-210, -25);
  ctx.lineTo(210, -25);
  ctx.stroke();

  /* Left pan */
  ctx.fillStyle=cssVar('--surface2');
  ctx.strokeStyle=cssVar('--border');
  ctx.lineWidth=2;
  [-180, 180].forEach(function(px){
    /* Chains */
    ctx.strokeStyle=cssVar('--border');
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(px, -25);
    ctx.lineTo(px, -5);
    ctx.stroke();
    /* Pan */
    ctx.fillStyle=cssVar('--surface2');
    ctx.strokeStyle=cssVar('--border');
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(px-45, -5);
    ctx.lineTo(px+45, -5);
    ctx.lineTo(px+35, 15);
    ctx.lineTo(px-35, 15);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });

  /* Labels on pans */
  ctx.font='700 15px Nunito Sans, sans-serif';
  ctx.textAlign='center';
  ctx.fillStyle=cssVar('--accent');
  ctx.fillText(balFmt(bal.lx, bal.ln), -180, -35);
  ctx.fillText(balFmt(bal.rx, bal.rn), 180, -35);

  ctx.restore();
  ctx.restore();
}

var parExprs=[], parIdx=0;

function newParExpr(){
  parIdx=(parIdx+1) % parExprs.length;
  var e=parExprs[parIdx];
  var sign=e.b >= 0 ? '+ '+e.b : '- '+(-e.b);
  document.getElementById('parExpr').textContent=e.a+'(x '+sign+')';
  document.getElementById('parIn').value='';
  document.getElementById('parFb').style.display='none';
}

function checkPar(){
  var e=parExprs[parIdx];
  var v=document.getElementById('parIn').value.replace(/\s/g,'').toLowerCase();
  var fb=document.getElementById('parFb');
  fb.style.display='block';
  /* Normalize expected */
  var expected=e.ans.replace(/\s/g,'');
  /* Accept variations */
  var ok=(v===expected);
  if(!ok && expected.indexOf('+-')>=0) ok=(v===expected.replace('+-','-'));
  if(!ok && expected.indexOf('-+')>=0) ok=(v===expected.replace('-+','-'));
  if(ok){
    fb.className='feedback correct';
    fb.textContent='Correct !';
  } else {
    var nice=e.ans.replace(/-/g,' - ').replace(/\+/g,' + ').replace(/  /g,' ').trim();
    fb.className='feedback wrong';
    fb.textContent='Le resultat attendu est : '+nice;
  }
}

function drawRect(){
  var c=document.getElementById('cvRect');
  if(!c) return;
  var ctx=c.getContext('2d');
  var w=c.width, h=c.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle=cssVar('--surface');
  ctx.fillRect(0,0,w,h);

  var rw=260, rh=110;
  var rx=(w-rw)/2, ry=(h-rh)/2;
  ctx.strokeStyle=cssVar('--accent');
  ctx.lineWidth=2;
  ctx.strokeRect(rx, ry, rw, rh);
  ctx.fillStyle=cssVar('--accent-light');
  ctx.fillRect(rx, ry, rw, rh);

  ctx.font='600 16px Nunito Sans, sans-serif';
  ctx.textAlign='center';
  ctx.fillStyle=cssVar('--heading');
  ctx.fillText('Longueur = 2x = 18 cm', rx + rw/2, ry + rh/2 + 5);

  ctx.save();
  ctx.translate(rx - 18, ry + rh/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText('x = 9 cm', 0, 0);
  ctx.restore();

  ctx.fillStyle=cssVar('--muted');
  ctx.font='400 13px Nunito Sans, sans-serif';
  ctx.fillText('Perimetre = 2(9 + 18) = 54 cm', w/2, h - 10);
}

function checkExo(i, answer){
  var v=parseFloat(document.getElementById('exoIn'+i).value);

      window._exoDone.push(i);
      var pct=Math.round(100*window._exoDone.length/window._exoTotal);
      var bar=document.getElementById('exoProgress');
      if(bar) bar.style.width=pct+'%';
      var cnt=document.getElementById('exoCount');
      if(cnt) cnt.textContent=window._exoDone.length+' / '+window._exoTotal+' reussis';
    }
  } else {
    fb.className='feedback wrong';
    fb.textContent='Ce n\'est pas la bonne reponse. Consulte la correction pour comprendre.';
  }
}

     opts:['3','x','4','1/4'],

      html+='<label><input type="radio" name="qcm'+i+'" value="'+j+'"> '+opt+'</label>';
    });
    html+='</div>';
  });

  html+='<div style="text-align:center;margin:24px 0">'+
    '<button class="btn" style="padding:12px 36px;font-size:1rem" onclick="scoreQCM()">Corriger le QCM</button>'+
    '</div>';
  html+='<div id="qcmScore" class="score-box" style="display:none"></div>';
  el.innerHTML=html;
  window._qcmData=questions;
}

function scoreQCM(){
  var qs=window._qcmData;
  var score=0;
  qs.forEach(function(q, i){
    var div=document.getElementById('qcm'+i);
    var sel=div.querySelector('input[name="qcm'+i+'"]:checked');
    div.classList.remove('answered-right','answered-wrong');
    if(sel && parseInt(sel.value)===q.ans){
      score++;
      div.classList.add('answered-right');
    } else {
      div.classList.add('answered-wrong');
    }
    /* Highlight correct answer */
    var labels=div.querySelectorAll('label');
    labels.forEach(function(lb, j){
      lb.style.fontWeight=(j===q.ans) ? '700' : '400';
      lb.style.color=(j===q.ans) ? 'var(--accent)' : '';
    });
  });
  var box=document.getElementById('qcmScore');
  box.style.display='block';
  var pct=Math.round(100*score/qs.length);
  var msg;
  if(pct >= 90) msg='Excellent travail !';
  else if(pct >= 75) msg='Tres bien, continue !';
  else if(pct >= 50) msg='Pas mal, mais revise les points manques.';
  else msg='Il faut revoir le cours attentivement.';
  box.innerHTML=score+' / '+qs.length+' ('+pct+' %)<br><span style="font-size:.9rem">'+msg+'</span>';
  box.scrollIntoView({behavior:'smooth', block:'center'});
}
